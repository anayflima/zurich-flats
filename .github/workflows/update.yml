name: Update report
on:
  workflow_dispatch:
    inputs:
      url:
        description: Link to the new report HTML
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Download report
        env:
          SRC: ${{ inputs.url }}
        run: |
          curl -fsSL "$SRC" -o index.html
          git config user.name blue-bot
          git config user.email blue-bot@users.noreply.github.com
          git add index.html
          git commit -m "Update report" || echo nochange
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
